name: GymPesos
options:
  bundleIdPrefix: com.alejosanchez
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.6.1"
    CURRENT_PROJECT_VERSION: "9"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""

targets:
  GymPesos:
    type: application
    platform: iOS
    sources:
      - path: GymPesos
      - path: Shared
    info:
      path: GymPesos/Info.plist
      properties:
        CFBundleDisplayName: Gym Pesos
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        UIRequiresFullScreen: true
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alejosanchez.gympesos
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-orange AppIcon-ice AppIcon-red AppIcon-violet AppIcon-mono"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_TARGET"
    dependencies:
      - target: GymWidget
        embed: true
    scheme: {}

  GymWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: GymWidget
      - path: Shared
    info:
      path: GymWidget/Info.plist
      properties:
        CFBundleDisplayName: Gym Pesos
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alejosanchez.gympesos.widget
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
